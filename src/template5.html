<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayr Energy - Global HV Asset Landscape</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1K8RFB50G9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1K8RFB50G9');
  </script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root{
      --bg0: #2000D3;
      --bg1: #2000D3;
      --bg2: #2000D3;

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.68);
      --stroke: rgba(255,255,255,0.10);

      --accent: #2f6cff;
      --accent2:#5aa2ff;

      --tableBg: rgba(255,255,255,0.97);
      --tableHead: #f3f6fb;
      --tableText: #0b1220;
      --tableMuted: #475569;

      --radius: 14px;
      --shadow: 0 16px 48px rgba(0,0,0,0.35);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(900px 450px at 14% 0%, rgba(47,108,255,0.22), transparent 60%),
        radial-gradient(700px 380px at 80% 10%, rgba(90,162,255,0.12), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg2));
      color: var(--text);
    }

    /* ---------- Top bar ---------- */
    .topbar{
      height: 96px;
      padding: 0 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-sizing: border-box;
      position: relative;

      background:
        radial-gradient(1200px 420px at 20% 0%, rgba(47,108,255,0.22), transparent 60%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 70%, rgba(10,16,32,0.6) 100%);
      border-bottom: 1px solid var(--stroke);
      gap: 16px;
    }

    .topbar::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:-1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(47,108,255,0.75), transparent);
      pointer-events:none;
    }

    .topbar::before{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 44px;
      background:
        radial-gradient(120px 44px at 10% 100%, rgba(255,255,255,0.06), transparent 70%),
        radial-gradient(160px 52px at 30% 100%, rgba(255,255,255,0.04), transparent 70%),
        radial-gradient(200px 58px at 55% 100%, rgba(255,255,255,0.035), transparent 70%),
        radial-gradient(160px 52px at 78% 100%, rgba(255,255,255,0.04), transparent 70%);
      opacity: 0.85;
      pointer-events:none;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width: 260px;
      z-index: 1;
    }

    .logo{
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .brand-text{
      display:none;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .title{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .title-kicker{
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .title-main{
      margin-top: 3px;
      font-size: 16px;
      font-weight: 650;
      color: var(--text);
    }

    /* Highlight AYR manufacturers in table */
    .ayr-mfg {
      color: #2000D3;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    /* ===== AYR special marker (diamond + glow) ===== */
    .ayr-marker{
      width: 18px;
      height: 18px;
      transform: rotate(45deg);
      border-radius: 4px;
      background: #2000D3;
      border: 2px solid #ffffff;
      box-shadow:
        0 0 0 3px rgba(0,229,255,0.22),
        0 0 18px rgba(0,229,255,0.75);
    }
    .ayr-marker::after{
      content:"";
      position:absolute;
      inset: 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.25);
    }
    .ayr-marker.is-hot{
      box-shadow:
        0 0 0 4px rgba(0,229,255,0.30),
        0 0 28px rgba(0,229,255,0.95);
    }

    /* ---------- Controls panel ---------- */
    .controls-panel{
      background: rgba(170,197,255,0.96);
      border-radius: 16px;
      padding: 10px 12px;
      z-index: 1;
      max-width: 68vw;
    }

    .controls{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .control-group{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #dbe4f0;
      color: #334155;
      font-size: 11px;
      user-select:none;
    }

    input[type="text"], select{
      padding: 10px 12px;
      border-radius: 999px;
      background: #ffffff;
      color: #0b1220;
      border: 1px solid #dbe4f0;
      font-size: 12px;
      outline: none;
      box-shadow: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="text"]::placeholder{ color: #64748b; }

    input[type="text"]:focus, select:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(47,108,255,0.15);
    }

    input[type="range"]{ accent-color: var(--accent); }

    select{
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #64748b 50%),
        linear-gradient(135deg, #64748b 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 12px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }

    /* ---------- Layout ---------- */
    #wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 96px);
    }

    #map-area {
      height: 46%;
      min-height: 20%;
      width: 100%;
      position: relative;
    }
    #map { height: 100%; width: 100%; }

    #resizer{
      height: 12px;
      width: 100%;
      cursor: ns-resize;
      display:flex;
      justify-content:center;
      align-items:center;
      user-select:none;
      color: rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.08);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.10);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    #resizer:hover{
      background: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.88);
    }

    #table-area {
      flex: 1;
      overflow-y: auto;
      background: var(--tableBg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      min-width: 1100px;
      color: var(--tableText);
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--tableHead);
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid #dbe4f0;
      z-index: 10;
      color: var(--tableMuted);
    }

    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #eef2f7;
      vertical-align: middle;
    }

    tbody tr:hover td{
      background: rgba(32, 0, 211, 0.06);
      cursor: pointer;
    }
    tbody tr.is-selected td{
      background: rgba(32, 0, 211, 0.12);
    }

    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 9px;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.10em;
    }

    .site-label {
      background: rgba(255,255,255,0.93);
      border: 1.2px solid #0b1220;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.20);
    }

    .legend {
      background: rgba(11, 18, 32, 0.92);
      color: rgba(255,255,255,0.92);
      padding: 12px 12px;
      border-radius: 14px;
      line-height: 16px;
      box-shadow: var(--shadow);
      font-size: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .legend i {
      width: 10px;
      height: 10px;
      float: left;
      margin-right: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      margin-top: 3px;
    }

    /* Collapsible OEM definition legend */
    .legend.legend-notes{
        max-width: 340px;
        line-height: 1.35;
        padding: 10px 12px;
    }
    .legend.legend-notes .k{ font-weight: 800; }
    .legend.legend-notes .d{ color: rgba(255,255,255,0.78); }

    .legend-notes .legend-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
        cursor:pointer;
        user-select:none;
    }
    .legend-notes .legend-title{
        font-weight: 800;
    }
    .legend-notes .legend-toggle{
        width: 26px;
        height: 22px;
        display:flex;
        align-items:center;
        justify-content:center;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.88);
        font-weight: 900;
        line-height: 1;
    }
    .legend-notes .legend-body{
        margin-top: 10px;
    }
    .legend-notes.is-collapsed .legend-body{
        display:none;
    }
    .legend-notes.is-collapsed{
        padding-bottom: 8px;
    }

    .legend-notes .dot{
    display:inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    transform: translateY(1px);
    }

    .legend-notes .dot.global{ background:#ef4444; }
    .legend-notes .dot.regional{ background:#16a34a; }
    .legend-notes .dot.international{ background:#d97706; }

    .legend-notes .k.global{ color:#ef4444; }
    .legend-notes .k.regional{ color:#16a34a; }
    .legend-notes .k.international{ color:#d97706; }


    .leaflet-popup-content-wrapper, .leaflet-popup-tip{
      background: rgba(11, 18, 32, 0.94);
      color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
    }
    .leaflet-popup-content{
      margin: 10px 12px;
      font-size: 12px;
    }
    .leaflet-container a.leaflet-popup-close-button{
      color: rgba(255,255,255,0.78);
    }

    @media (max-width: 980px){
      .topbar{ height: auto; padding: 14px 16px; align-items:flex-start; }
      #wrapper{ height: calc(100vh - 140px); }
      .controls-panel{ max-width: 100%; width: 100%; }
      .brand{ min-width: unset; }
    }

    /* ===== GPL 3.0 Notice ===== */
    .license-note{
      position: fixed;
      right: 10px;
      bottom: 8px;
      font-size: 10px;
      line-height: 1.2;
      color: rgba(255,255,255,0.80);
      background: rgba(0,0,0,0.22);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      z-index: 9999;
      user-select: none;
    }
    .license-note a{
      color: rgba(255,255,255,0.92);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <img
        src="./logo.png"
        alt="Ayr Energy"
        class="logo"
        onerror="this.style.display='none'; document.querySelector('.brand-text').style.display='block';"
      />
      <div class="brand-text">AYR ENERGY</div>

      <div class="title">
        <div class="title-kicker">HV Assets</div>
        <div class="title-main">Global Landscape</div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="controls">
        <input type="text" id="searchTerm" placeholder="Search mfg, city..." onkeyup="renderUI()">

        <div class="control-group">
          <label>Min Voltage</label>
          <input type="range" id="voltSlider" min="0" max="1200" step="50" value="0" oninput="updateSlider(this.value)">
          <span id="voltVal">0 kV</span>
        </div>

        <div class="control-group">
          <input type="checkbox" id="labelToggle" checked onchange="renderUI()"> Labels
        </div>

        <select id="regFilter" onchange="renderUI()">
          <option value="All">All Regions</option>
          <option value="North America">North America</option>
          <option value="International">International</option>
        </select>

        <select id="typeFilter" onchange="renderUI()">
          <option value="All">All Categories</option>
          <option value="Transformer">Transformers</option>
          <option value="Breaker">Breakers</option>
        </select>
      </div>
    </div>
  </header>

  <div id="wrapper">
    <div id="map-area"><div id="map"></div></div>
    <div id="resizer">⬟</div>

    <div id="table-area">
      <table>
        <thead>
          <tr>
            <th style="width: 30px;">#</th>
            <th>Manufacturer</th>
            <th>Facility Location</th>
            <th>Capability (Voltage / Capacity)</th>
            <th>OEM Class</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="license-note">
    © <span id="yr"></span> Ayr Energy · Licensed under
    <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">GNU GPL 3.0</a>
  </div>

  <script>
    document.getElementById("yr").textContent = String(new Date().getFullYear());

    const COLORS = { "Global": "#ef4444", "North America": "#16a34a", "International": "#d97706","AYR":"#2000D3"};
    const AYR_COLOR = "#2000D3";

    // Python injects JSON array here
    const DATA = __DATA__;

    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
    const mGroup = L.layerGroup().addTo(map);

    function updateSlider(val) {
      document.getElementById('voltVal').innerText = val + " kV";
      renderUI();
    }

    function extractVoltage(str) {
      const match = String(str).match(/(\d+)\s*kV/i);
      return match ? parseInt(match[1]) : 0;
    }

    function hasCoords(s) {
      const lat = Number(s.lat), lon = Number(s.lon);
      return Number.isFinite(lat) && Number.isFinite(lon);
    }

    function makeAyrIcon(hot=false){
      return L.divIcon({
        className: "",
        html: `<div class="ayr-marker ${hot ? 'is-hot' : ''}"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });
    }

    // ===== Marker <-> row interactions =====
    let hoveredMarker = null;
    let selectedMarker = null;

    function setMarkerHighlight(marker, on) {
      if (!marker) return;

      // circleMarker (non-AYR)
      if (marker.setStyle) {
        marker.setStyle({
          radius: on ? 9 : 6,
          weight: on ? 3 : 1.5,
          fillOpacity: on ? 1.0 : 0.92
        });
        return;
      }

      // L.marker (AYR divIcon)
      if (marker.setIcon) {
        marker.setIcon(makeAyrIcon(on));
      }
    }

    function clearSelectedRow() {
      document.querySelectorAll("#tbody tr.is-selected").forEach(tr => tr.classList.remove("is-selected"));
    }

    function renderUI() {
      const type = document.getElementById('typeFilter').value;
      const reg = document.getElementById('regFilter').value;
      const search = document.getElementById('searchTerm').value.toLowerCase();
      const minVolt = parseInt(document.getElementById('voltSlider').value);
      const labelsOn = document.getElementById('labelToggle').checked;
      const tbody = document.getElementById('tbody');

      tbody.innerHTML = "";
      mGroup.clearLayers();

      hoveredMarker = null;
      selectedMarker = null;

      let count = 1;

      DATA.forEach(s => {
        const v = extractVoltage(s.cap);

        const matchesSearch =
          String(s.mfg).toLowerCase().includes(search) ||
          String(s.loc).toLowerCase().includes(search) ||
          String(s.cap).toLowerCase().includes(search);

        const matchesVolt = (minVolt === 0 || v >= minVolt);

        if (
          matchesSearch && matchesVolt &&
          (type === "All" || s.cat === type) &&
          (reg === "All" || s.reg === reg)
        ) {
          const isAyr = String(s.mfg).toLowerCase().includes("ayr");

          // Create marker ONLY if coords exist
          let marker = null;
          if (hasCoords(s)) {
            const lat = Number(s.lat), lon = Number(s.lon);
            const markerColor = isAyr ? AYR_COLOR : (COLORS[s.oem] || "#64748b");

            if (isAyr) {
              marker = L.marker([lat, lon], { icon: makeAyrIcon(false) }).addTo(mGroup);
            } else {
              marker = L.circleMarker([lat, lon], {
                radius: 6,
                fillColor: markerColor,
                color: "#fff",
                weight: 1.5,
                fillOpacity: 0.95
              }).addTo(mGroup);
            }

            if (labelsOn) {
              const labelTxt = (s.cap && String(s.cap).length > 5)
                ? (isAyr ? `★ ${s.mfg} - ${s.cap}` : `${s.mfg} - ${s.cap}`)
                : s.mfg;

              marker.bindTooltip(labelTxt, {
                permanent: true,
                className: 'site-label',
                direction: 'right',
                offset: [8, 0]
              });
            }

            marker.bindPopup(`<strong>${s.mfg}</strong><br>${s.loc}<br>${s.cap}`);
          }

          // Create row
          const tr = document.createElement("tr");
          tr.innerHTML =
            `<td>${count}</td>
             <td><b class="${isAyr ? 'ayr-mfg' : ''}">${s.mfg}</b></td>
             <td>${s.loc}</td>
             <td>${s.cap}</td>
             <td><span class="pill" style="background:${COLORS[s.oem] || "#64748b"}">${s.oem}</span></td>
             <td><span class="pill" style="background:#64748b">${s.cat}</span></td>`;

          // Hover => highlight marker
          tr.addEventListener("mouseenter", () => {
            if (!marker) return;
            if (hoveredMarker && hoveredMarker !== selectedMarker) setMarkerHighlight(hoveredMarker, false);
            hoveredMarker = marker;
            if (marker !== selectedMarker) setMarkerHighlight(marker, true);
          });

          tr.addEventListener("mouseleave", () => {
            if (!marker) return;
            if (marker !== selectedMarker) setMarkerHighlight(marker, false);
            hoveredMarker = null;
          });

          // Click => pan/zoom + popup + keep highlighted + select row
          tr.addEventListener("click", () => {
            clearSelectedRow();
            tr.classList.add("is-selected");

            if (!marker) return;

            if (selectedMarker && selectedMarker !== marker) setMarkerHighlight(selectedMarker, false);
            selectedMarker = marker;
            setMarkerHighlight(marker, true);

            map.setView([Number(s.lat), Number(s.lon)], Math.max(map.getZoom(), 5), { animate: true });
            marker.openPopup();
          });

          tbody.appendChild(tr);
          count++;
        }
      });
    }

    const legend = L.control({position: 'topright'});
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML += '<b>OEM Class</b><br>';
      for (let label in COLORS) {
        div.innerHTML += `<i style="background:${COLORS[label]}"></i> ${label}<br>`;
      }
    //   div.innerHTML += `<i style="background:${AYR_COLOR}"></i> AYR<br>`;
      return div;
    };
    legend.addTo(map);

    const legendNotes = L.control({ position: 'bottomright' });

    legendNotes.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend legend-notes is-collapsed');

      div.innerHTML = `
        <div class="legend-head" role="button" aria-label="Toggle OEM definitions" tabindex="0">
          <div class="legend-title">OEM Class Definitions</div>
          <div class="legend-toggle" aria-hidden="true">+</div>
        </div>

        <div class="legend-body">
          <div>
            <span class="dot global"></span>
            <span class="k global">Global:</span>
            <span class="d">Manufacturing footprint on 3+ continents with strong US presence</span>
          </div>

          <div>
            <span class="dot regional"></span>
            <span class="k regional">North America:</span>
            <span class="d">Manufacturing footprint in the US</span>
          </div>

          <div>
            <span class="dot international"></span>
            <span class="k international">International:</span>
            <span class="d">Manufacturing footprint outside the US with little or no physical presence in the US</span>
          </div>
        </div>
      `;

      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);

    function toggle() {
      const collapsed = div.classList.toggle('is-collapsed');
      const btn = div.querySelector('.legend-toggle');
      if (btn) btn.textContent = collapsed ? '+' : '–';
    }

    div.querySelector('.legend-head').addEventListener('click', toggle);
    div.querySelector('.legend-head').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggle();
      }
    });

    return div;
  };

  legendNotes.addTo(map);


    // Resizer (vertical split between map + table)
    const resizer = document.getElementById('resizer'), area = document.getElementById('map-area');
    let isResizing = false;
    resizer.addEventListener('mousedown', () => isResizing = true);
    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      let offset = e.clientY - 96;
      let percentage = (offset / (window.innerHeight - 96)) * 100;
      if (percentage > 20 && percentage < 80) {
        area.style.height = percentage + "%";
        map.invalidateSize();
      }
    });
    document.addEventListener('mouseup', () => isResizing = false);

    renderUI();
  </script>
</body>
</html>
