<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ayr Energy - Global HV Asset Landscape</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* Ayr-ish look: deep blacks, crisp type, blue accent, subtle glow/gradients */
    :root{
      --bg0: #2000D3;
      --bg1: #2000D3;
      --bg2: #2000D3;

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.68);

      --stroke: rgba(255,255,255,0.10);
      --stroke2: rgba(255,255,255,0.14);

      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.09);

      --accent: #526EE2;   /* bold Ayr-ish blue */
      --accent2:#AAC5FF;   /* highlight */

      /* Light area */
      --tableBg: rgba(255,255,255,0.97);
      --tableHead: #f3f6fb;
      --tableText: #0b1220;
      --tableMuted: #475569;

      /* --radius: 14px; */
      /* --radius-sm: 10px; */
      /* --shadow: 0 16px 48px #2000D3; */
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(900px 450px at 14% 0%, rgba(47,108,255,0.22), transparent 60%),
        radial-gradient(700px 380px at 80% 10%, rgba(90,162,255,0.12), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg2));
      color: var(--text);
    }

    /* ---------- Top bar ---------- */
    .topbar{
      height: 96px;
      padding: 0 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-sizing: border-box;
      position: relative;

      background:
        radial-gradient(1200px 420px at 20% 0%, rgba(47,108,255,0.22), transparent 60%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 70%, rgba(10,16,32,0.6) 100%);
      border-bottom: 1px solid var(--stroke);
    }

    /* Accent hairline */
    .topbar::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:-1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(47,108,255,0.75), transparent);
      pointer-events:none;
    }

    /* Subtle wave motif */
    .topbar::before{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 44px;
      background:
        radial-gradient(120px 44px at 10% 100%, rgba(255,255,255,0.06), transparent 70%),
        radial-gradient(160px 52px at 30% 100%, rgba(255,255,255,0.04), transparent 70%),
        radial-gradient(200px 58px at 55% 100%, rgba(255,255,255,0.035), transparent 70%),
        radial-gradient(160px 52px at 78% 100%, rgba(255,255,255,0.04), transparent 70%);
      opacity: 0.85;
      pointer-events:none;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width: 320px;
    }

    .logo{
      height: 40px;
      width: auto;
      object-fit: contain;
      /* filter: drop-shadow(0 10px 26px rgba(0,0,0,0.45)); */
    }

    .brand-text{
      display:none;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .title{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .title-kicker{
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .title-main{
      margin-top: 3px;
      font-size: 16px;
      font-weight: 650;
      color: var(--text);
    }

    /* ---------- Controls ---------- */
    .controls{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    input[type="text"], select{
      padding: 10px 12px;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--stroke);
      font-size: 12px;
      outline: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      /* box-shadow: 0 8px 24px rgba(0,0,0,0.15); */
      transition: border-color 140ms ease, background 140ms ease;
    }

    input[type="text"]::placeholder{
      color: rgba(255,255,255,0.52);
    }

    input[type="text"]:focus, select:focus{
      border-color: rgba(47,108,255,0.55);
      background: rgba(255,255,255,0.075);
    }

    .control-group{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--stroke);
      color: var(--muted);
      font-size: 11px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      /* box-shadow: 0 8px 24px rgba(0,0,0,0.15); */
      user-select:none;
    }

    input[type="range"]{
      accent-color: var(--accent);
    }

    /* ---------- Layout ---------- */
    #wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 96px);
    }

    #map-area {
      height: 46%;
      min-height: 20%;
      width: 100%;
      position: relative;
    }
    #map { height: 100%; width: 100%; }

    #resizer{
      height: 12px;
      width: 100%;
      cursor: ns-resize;
      display:flex;
      justify-content:center;
      align-items:center;
      user-select:none;
      color: rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.08);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.10);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    #resizer:hover{
      background: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.88);
    }

    #table-area {
      flex: 1;
      overflow-y: auto;
      background: var(--tableBg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      min-width: 1100px;
      color: var(--tableText);
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--tableHead);
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid #dbe4f0;
      z-index: 10;
      color: var(--tableMuted);
    }

    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #eef2f7;
      vertical-align: middle;
    }

    tbody tr:hover td{
      background: rgba(47,108,255,0.04);
    }

    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 9px;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.10em;
    }

    .site-label {
      background: rgba(255,255,255,0.93);
      border: 1.2px solid #0b1220;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
      border-radius: 8px;
      /* box-shadow: 0 8px 20px rgba(0,0,0,0.20); */
    }

    .legend {
      background: rgba(11, 18, 32, 0.92);
      color: rgba(255,255,255,0.92);
      padding: 12px 12px;
      border-radius: var(--radius);
      line-height: 16px;
      /* box-shadow: var(--shadow); */
      font-size: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .legend i {
      width: 10px;
      height: 10px;
      float: left;
      margin-right: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      margin-top: 3px;
    }

    /* Leaflet popup styling */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip{
      background: rgba(11, 18, 32, 0.94);
      color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      /* box-shadow: var(--shadow); */
    }
    .leaflet-popup-content{
      margin: 10px 12px;
      font-size: 12px;
    }
    .leaflet-container a.leaflet-popup-close-button{
      color: rgba(255,255,255,0.78);
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <img
        src="./logo.png"
        alt="Ayr Energy"
        class="logo"
        onerror="this.style.display='none'; document.querySelector('.brand-text').style.display='block';"
      />
      <div class="brand-text">AYR ENERGY</div>

      <div class="title">
        <div class="title-kicker">HV Assets</div>
        <div class="title-main">Global Landscape</div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchTerm" placeholder="Search mfg, city..." onkeyup="renderUI()">

      <div class="control-group">
        <label>Min Voltage</label>
        <input type="range" id="voltSlider" min="0" max="1200" step="50" value="0" oninput="updateSlider(this.value)">
        <span id="voltVal">0 kV</span>
      </div>

      <div class="control-group">
        <input type="checkbox" id="labelToggle" checked onchange="renderUI()"> Labels
      </div>

      <select id="regFilter" onchange="renderUI()">
        <option value="All">All Regions</option>
        <option value="North America">North America</option>
        <option value="International">International</option>
      </select>

      <select id="typeFilter" onchange="renderUI()">
        <option value="All">All Categories</option>
        <option value="Transformer">Transformers</option>
        <option value="Breaker">Breakers</option>
      </select>
    </div>
  </header>

  <div id="wrapper">
    <div id="map-area"><div id="map"></div></div>
    <div id="resizer">⬟</div>

    <div id="table-area">
      <table>
        <thead>
          <tr>
            <th style="width: 30px;">#</th>
            <th>Manufacturer</th>
            <th>Facility Location</th>
            <th>Capability (Voltage / Capacity)</th>
            <th>OEM Class</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const COLORS = { "Global": "#ef4444", "Regional": "#16a34a", "International": "#d97706" };

    // Python injects JSON array here
    const DATA = __DATA__;

    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18
    }).addTo(map);
    const mGroup = L.layerGroup().addTo(map);

    function updateSlider(val) {
      document.getElementById('voltVal').innerText = val + " kV";
      renderUI();
    }

    function extractVoltage(str) {
      const match = String(str).match(/(\d+)\s*kV/i);
      return match ? parseInt(match[1]) : 0;
    }

    function renderUI() {
      const type = document.getElementById('typeFilter').value;
      const reg = document.getElementById('regFilter').value;
      const search = document.getElementById('searchTerm').value.toLowerCase();
      const minVolt = parseInt(document.getElementById('voltSlider').value);
      const labelsOn = document.getElementById('labelToggle').checked;
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = "";
      mGroup.clearLayers();

      let count = 1;
      DATA.forEach(s => {
        const v = extractVoltage(s.cap);
        const matchesSearch =
          String(s.mfg).toLowerCase().includes(search) ||
          String(s.loc).toLowerCase().includes(search) ||
          String(s.cap).toLowerCase().includes(search);

        const matchesVolt = (minVolt === 0 || v >= minVolt);

        if (
          matchesSearch && matchesVolt &&
          (type === "All" || s.cat === type) &&
          (reg === "All" || s.reg === reg)
        ) {
          const row = tbody.insertRow();
          row.innerHTML =
            `<td>${count}</td>
             <td><b>${s.mfg}</b></td>
             <td>${s.loc}</td>
             <td>${s.cap}</td>
             <td><span class="pill" style="background:${COLORS[s.oem] || "#64748b"}">${s.oem}</span></td>
             <td><span class="pill" style="background:#64748b">${s.cat}</span></td>`;

          const marker = L.circleMarker([s.lat, s.lon], {
            radius: 6,
            fillColor: COLORS[s.oem] || "#64748b",
            color: "#fff",
            weight: 1.5,
            fillOpacity: 0.92
          }).addTo(mGroup);

          if (labelsOn) {
            const labelTxt = s.cap && s.cap.length > 5 ? `${s.mfg} - ${s.cap}` : s.mfg;
            marker.bindTooltip(labelTxt, {
              permanent: true,
              className: 'site-label',
              direction: 'right',
              offset: [8, 0]
            });
          }

          marker.bindPopup(`<strong>${s.mfg}</strong><br>${s.loc}<br>${s.cap}`);
          count++;
        }
      });
    }

    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML += '<b>OEM Class</b><br>';
      for (let label in COLORS) {
        div.innerHTML += `<i style="background:${COLORS[label]}"></i> ${label}<br>`;
      }
      return div;
    };
    legend.addTo(map);

    const resizer = document.getElementById('resizer'), area = document.getElementById('map-area');
    let isResizing = false;
    resizer.addEventListener('mousedown', () => isResizing = true);
    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      let offset = e.clientY - 96;
      let percentage = (offset / (window.innerHeight - 96)) * 100;
      if (percentage > 20 && percentage < 80) {
        area.style.height = percentage + "%";
        map.invalidateSize();
      }
    });
    document.addEventListener('mouseup', () => isResizing = false);

    renderUI();
  </script>
</body>
</html>
