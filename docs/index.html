  <style>
    /* Ayr-ish look: deep blacks, crisp type, blue accent, subtle glow/gradients */
    :root{
      --bg0: #2000D3;
      --bg1: #2000D3;
      --bg2: #2000D3;

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.68);

      --stroke: rgba(255,255,255,0.10);

      --accent: #2f6cff;   /* bold Ayr-ish blue */
      --accent2:#5aa2ff;   /* highlight */

      /* Light area */
      --tableBg: rgba(255,255,255,0.97);
      --tableHead: #f3f6fb;
      --tableText: #0b1220;
      --tableMuted: #475569;

      --radius: 14px;
      --shadow: 0 16px 48px rgba(0,0,0,0.35);
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(900px 450px at 14% 0%, rgba(47,108,255,0.22), transparent 60%),
        radial-gradient(700px 380px at 80% 10%, rgba(90,162,255,0.12), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg2));
      color: var(--text);
    }

    /* ---------- Top bar ---------- */
    .topbar{
      height: 96px;
      padding: 0 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-sizing: border-box;
      position: relative;

      background:
        radial-gradient(1200px 420px at 20% 0%, rgba(47,108,255,0.22), transparent 60%),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 70%, rgba(10,16,32,0.6) 100%);
      border-bottom: 1px solid var(--stroke);
      gap: 16px;
    }

    /* Accent hairline */
    .topbar::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:-1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(47,108,255,0.75), transparent);
      pointer-events:none;
    }

    /* Subtle wave motif */
    .topbar::before{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height: 44px;
      background:
        radial-gradient(120px 44px at 10% 100%, rgba(255,255,255,0.06), transparent 70%),
        radial-gradient(160px 52px at 30% 100%, rgba(255,255,255,0.04), transparent 70%),
        radial-gradient(200px 58px at 55% 100%, rgba(255,255,255,0.035), transparent 70%),
        radial-gradient(160px 52px at 78% 100%, rgba(255,255,255,0.04), transparent 70%);
      opacity: 0.85;
      pointer-events:none;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width: 260px;
      z-index: 1; /* above header ornaments */
    }

    .logo{
      height: 40px;
      width: auto;
      object-fit: contain;
      /* filter: drop-shadow(0 10px 26px rgba(0,0,0,0.45)); */
    }

    .brand-text{
      display:none;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .title{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }
    .title-kicker{
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .title-main{
      margin-top: 3px;
      font-size: 16px;
      font-weight: 650;
      color: var(--text);
    }

    /* ---------- White controls panel ---------- */
    .controls-panel{
      background: rgba(170,197,255,0.96);
      border-radius: 16px;
      padding: 10px 12px;
      /* box-shadow:
        0 20px 50px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.8); */
      z-index: 1; /* above header ornaments */
      max-width: 68vw;
    }

    .controls{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .control-group{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #dbe4f0;
      color: #334155;
      font-size: 11px;
      user-select:none;
    }

    input[type="text"], select{
      padding: 10px 12px;
      border-radius: 999px;
      background: #ffffff;
      color: #0b1220;
      border: 1px solid #dbe4f0;
      font-size: 12px;
      outline: none;
      box-shadow: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="text"]::placeholder{
      color: #64748b;
    }

    input[type="text"]:focus, select:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(47,108,255,0.15);
    }

    input[type="range"]{
      accent-color: var(--accent);
    }

    /* Make selects look nicer on dark header */
    select{
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #64748b 50%),
        linear-gradient(135deg, #64748b 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 12px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }

    /* ---------- Layout ---------- */
    #wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 96px);
    }

    #map-area {
      height: 46%;
      min-height: 20%;
      width: 100%;
      position: relative;
    }
    #map { height: 100%; width: 100%; }

    #resizer{
      height: 12px;
      width: 100%;
      cursor: ns-resize;
      display:flex;
      justify-content:center;
      align-items:center;
      user-select:none;
      color: rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.08);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.10);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    #resizer:hover{
      background: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.88);
    }

    #table-area {
      flex: 1;
      overflow-y: auto;
      background: var(--tableBg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      min-width: 1100px;
      color: var(--tableText);
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--tableHead);
      padding: 12px;
      text-align: left;
      border-bottom: 2px solid #dbe4f0;
      z-index: 10;
      color: var(--tableMuted);
    }

    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #eef2f7;
      vertical-align: middle;
    }

    /* Hover + selected row styling */
    tbody tr:hover td{
      background: rgba(32, 0, 211, 0.06);
      cursor: pointer;
    }
    tbody tr.is-selected td{
      background: rgba(32, 0, 211, 0.12);
    }

    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 9px;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.10em;
    }

    .site-label {
      background: rgba(255,255,255,0.93);
      border: 1.2px solid #0b1220;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 800;
      white-space: nowrap;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.20);
    }

    .legend {
      background: rgba(11, 18, 32, 0.92);
      color: rgba(255,255,255,0.92);
      padding: 12px 12px;
      border-radius: 14px;
      line-height: 16px;
      box-shadow: var(--shadow);
      font-size: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .legend i {
      width: 10px;
      height: 10px;
      float: left;
      margin-right: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      margin-top: 3px;
    }

    /* Leaflet popup styling */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip{
      background: rgba(11, 18, 32, 0.94);
      color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: var(--shadow);
    }
    .leaflet-popup-content{
      margin: 10px 12px;
      font-size: 12px;
    }
    .leaflet-container a.leaflet-popup-close-button{
      color: rgba(255,255,255,0.78);
    }

    /* Responsive */
    @media (max-width: 980px){
      .topbar{ height: auto; padding: 14px 16px; align-items:flex-start; }
      #wrapper{ height: calc(100vh - 140px); }
      .controls-panel{ max-width: 100%; width: 100%; }
      .brand{ min-width: unset; }
    }

    /* ===== GPL 3.0 Notice (small) ===== */
    .license-note{
      position: fixed;
      right: 10px;
      bottom: 8px;
      font-size: 10px;
      line-height: 1.2;
      color: rgba(255,255,255,0.80);
      background: rgba(0,0,0,0.22);
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      z-index: 9999;
      user-select: none;
    }
    .license-note a{
      color: rgba(255,255,255,0.92);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
</head>

 "cap": "500 kV / 300+", "oem": "International", "cat": "Transformer", "reg": "International", "lat": 24.96, "lon": 121.22}, {"mfg": "CG Power", "loc": "Bhopal [IN]", "cap": "765 kV / 300+", "oem": "International", "cat": "Transformer", "reg": "International", "lat": 23.26, "lon": 77.41}, {"mfg": "Ayr Facility 1", "loc": "Prayagraj [IN]", "cap": "500 kV / 300+", "oem": "AYR BLUE DC", "cat": "Transformer", "reg": "International", "lat": 25.45, "lon": 81.85}, {"mfg": "Ayr Facility 2", "loc": "Mumbai [IN]", "cap": "345 kV / 100-300", "oem": "AYR BLUE DC", "cat": "Transformer", "reg": "International", "lat": 19.08, "lon": 72.88}, {"mfg": "GE Vernova", "loc": "Vadodara [IN]", "cap": "765 kV / 300+", "oem": "Global", "cat": "Transformer", "reg": "International", "lat": 22.31, "lon": 73.18}, {"mfg": "Siemens Energy", "loc": "Mumbai [IN]", "cap": "765 kV / 300+", "oem": "Global", "cat": "Transformer", "reg": "International", "lat": 19.0, "lon": 72.82}, {"mfg": "Toshiba", "loc": "Hyderabad [IN]", "cap": "765 kV / 300+", "oem": "Global", "cat": "Transformer", "reg": "International", "lat": 17.37, "lon": 78.48}, {"mfg": "Hitachi Energy", "loc": "Vadodara [IN]", "cap": "765 kV / 300+", "oem": "Global", "cat": "Transformer", "reg": "International", "lat": 22.24, "lon": 73.18}];

    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
    const mGroup = L.layerGroup().addTo(map);

    function updateSlider(val) {
      document.getElementById('voltVal').innerText = val + " kV";
      renderUI();
    }

    function extractVoltage(str) {
      const match = String(str).match(/(\d+)\s*kV/i);
      return match ? parseInt(match[1]) : 0;
    }

    // ===== Marker <-> row interactions =====
    let hoveredMarker = null;
    let selectedMarker = null;

    function setMarkerHighlight(marker, on) {
      if (!marker) return;
      marker.setStyle({
        radius: on ? 9 : 6,
        weight: on ? 3 : 1.5,
        fillOpacity: on ? 1.0 : 0.92
      });
    }

    function clearSelectedRow() {
      document.querySelectorAll("#tbody tr.is-selected").forEach(tr => tr.classList.remove("is-selected"));
    }

    function renderUI() {
      const type = document.getElementById('typeFilter').value;
      const reg = document.getElementById('regFilter').value;
      const search = document.getElementById('searchTerm').value.toLowerCase();
      const minVolt = parseInt(document.getElementById('voltSlider').value);
      const labelsOn = document.getElementById('labelToggle').checked;
      const tbody = document.getElementById('tbody');

      tbody.innerHTML = "";
      mGroup.clearLayers();

      hoveredMarker = null;
      selectedMarker = null;

      let count = 1;

      DATA.forEach(s => {
        const v = extractVoltage(s.cap);

        const matchesSearch =
          String(s.mfg).toLowerCase().includes(search) ||
          String(s.loc).toLowerCase().includes(search) ||
          String(s.cap).toLowerCase().includes(search);

        const matchesVolt = (minVolt === 0 || v >= minVolt);

        if (
          matchesSearch && matchesVolt &&
          (type === "All" || s.cat === type) &&
          (reg === "All" || s.reg === reg)
        ) {
          // Create marker
          const marker = L.circleMarker([s.lat, s.lon], {
            radius: 6,
            fillColor: COLORS[s.oem] || "#64748b",
            color: "#fff",
            weight: 1.5,
            fillOpacity: 0.92
          }).addTo(mGroup);

          if (labelsOn) {
            const labelTxt = s.cap && s.cap.length > 5 ? `${s.mfg} - ${s.cap}` : s.mfg;
            marker.bindTooltip(labelTxt, {
              permanent: true,
              className: 'site-label',
              direction: 'right',
              offset: [8, 0]
            });
          }
          marker.bindPopup(`<strong>${s.mfg}</strong><br>${s.loc}<br>${s.cap}`);

          // Create row (for event hooks)
          const tr = document.createElement("tr");
          tr.innerHTML =
            `<td>${count}</td>
             <td><b>${s.mfg}</b></td>
             <td>${s.loc}</td>
             <td>${s.cap}</td>
             <td><span class="pill" style="background:${COLORS[s.oem] || "#64748b"}">${s.oem}</span></td>
             <td><span class="pill" style="background:#64748b">${s.cat}</span></td>`;

          // Hover => highlight marker
          tr.addEventListener("mouseenter", () => {
            if (hoveredMarker && hoveredMarker !== selectedMarker) setMarkerHighlight(hoveredMarker, false);
            hoveredMarker = marker;
            if (marker !== selectedMarker) setMarkerHighlight(marker, true);
          });

          tr.addEventListener("mouseleave", () => {
            if (marker !== selectedMarker) setMarkerHighlight(marker, false);
            hoveredMarker = null;
          });

          // Click => pan/zoom + popup + keep highlighted + select row
          tr.addEventListener("click", () => {
            if (selectedMarker && selectedMarker !== marker) setMarkerHighlight(selectedMarker, false);

            clearSelectedRow();
            tr.classList.add("is-selected");

            selectedMarker = marker;
            setMarkerHighlight(marker, true);

            map.setView([s.lat, s.lon], Math.max(map.getZoom(), 5), { animate: true });
            marker.openPopup();
          });

          tbody.appendChild(tr);
          count++;
        }
      });
    }

    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML += '<b>OEM Class</b><br>';
      for (let label in COLORS) {
        div.innerHTML += `<i style="background:${COLORS[label]}"></i> ${label}<br>`;
      }
      return div;
    };
    legend.addTo(map);

    const resizer = document.getElementById('resizer'), area = document.getElementById('map-area');
    let isResizing = false;
    resizer.addEventListener('mousedown', () => isResizing = true);
    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      let offset = e.clientY - 96;
      let percentage = (offset / (window.innerHeight - 96)) * 100;
      if (percentage > 20 && percentage < 80) {
        area.style.height = percentage + "%";
        map.invalidateSize();
      }
    });
    document.addEventListener('mouseup', () => isResizing = false);

    renderUI();
  </script>
